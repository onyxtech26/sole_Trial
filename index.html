<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="SOLE — the operations system for tour operators. Bookings, grouping, manifests, messaging and finance in one panel. Free trial." />

    <title>SOLE · Free trial</title>

    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="mask-icon" href="/favicon.png" color="#fd9707" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Painted before the bundle arrives so the first frame is the brand,
         never a white flash. React swaps it for the real splash on mount. */
      #boot {
        position: fixed;
        inset: 0;
        background: #f6f7f9;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot span {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #0b1220;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      #boot img { height: 22px; width: auto; display: block; }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(0.94); opacity: 0.72; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span><img src="/logo-mark.png" alt="SOLE" /></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
